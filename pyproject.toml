[project]
name = "foundry"
version = "0.1.0"
description = "An autonomous ML engineering lab on LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "langchain-openai>=1,<2",
  "psycopg[binary,pool]>=3.2",
  "mlflow>=3.14,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "fastapi>=0.140,<1",
  "uvicorn[standard]>=0.51,<1",
]

[dependency-groups]
dev = [
  "ruff>=0.16",
  "pyright>=1.1.411",
  "pytest>=9.1",
  "pandas>=2.3,<3",
  "numpy>=2,<3",
  "httpx>=0.28,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
include = ["foundry", "app", "scripts", "tests"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: requires a running Docker daemon and the foundry-sandbox:latest image",
  "postgres: requires a reachable Postgres instance (DATABASE_URL)",
  "mlflow: requires a reachable MLflow tracking server (MLFLOW_TRACKING_URI)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundry"]
