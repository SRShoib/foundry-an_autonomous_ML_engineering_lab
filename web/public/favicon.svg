<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The foundry mark (src/components/brand/Logo.tsx), with literal colours because a favicon cannot
       read the page's CSS custom properties. Keep the geometry in step with LogoMark. -->
  <defs>
    <linearGradient id="g" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b6dff"/>
      <stop offset="0.55" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#g)"/>
  <rect width="32" height="16" rx="9" fill="url(#s)"/>
  <g fill="#ffffff">
    <rect x="9" y="7.5" width="13" height="3" rx="1.5"/>
    <rect x="9" y="7.5" width="3" height="17" rx="1.5"/>
    <rect x="9" y="14" width="9" height="3" rx="1.5"/>
  </g>
</svg>
