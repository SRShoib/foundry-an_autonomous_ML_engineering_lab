services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foundry}
      POSTGRES_DB: ${POSTGRES_DB:-foundry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-mlflow-db.sql:/docker-entrypoint-initdb.d/init-mlflow-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foundry} -d ${POSTGRES_DB:-foundry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: ./docker/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI:-postgresql://foundry:foundry@postgres:5432/mlflow}
      --serve-artifacts
      --artifacts-destination /mlruns-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/mlruns-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The operator console, built and served on :5174 (`make console`). Not started by `make up`:
  # the `console` profile keeps `up --build --wait` from running `npm ci` and a Vite build on every
  # backend cycle. For development use `make web` instead (Vite on :5173, hot reload). The API is
  # NOT a service here — it must reach the host Docker daemon for the sandbox — so the console
  # reaches it on the host at host.docker.internal (docker/web/Caddyfile).
  web:
    profiles: ["console"]
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FOUNDRY_API_UPSTREAM: ${FOUNDRY_API_UPSTREAM:-host.docker.internal:8000}
    ports:
      - "${WEB_PORT:-5174}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mlflow_artifacts:
